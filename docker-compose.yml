version: '3.9'
networks:
  basic:
services:
  backend:
    # build:
    #   context: ./
    #   dockerfile: Dockerfile
    #   target: backend
    container_name: greaterwms_backend
    image: greaterwms/greaterwms:backend
    restart: always
    privileged: true
    volumes:
      - ./:/GreaterWMS/:rw
      - ./supervisord.conf:/etc/supervisor/supervisord.conf
    ports:
      - '8008:8008'
    environment:
      PYTHONUNBUFFERED: 1
    networks:
      - basic
